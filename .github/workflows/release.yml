name: Release Velocity Drive APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g., v5.0.41)'
        required: true
        default: 'v5.0.41'
      release_name:
        description: 'Release Title'
        required: false
        default: ''
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Dual Asset Release Publication
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Dual Release Assets
        run: |
          echo "Scanning for Android APK release assets..."
          VERSIONED_APK=$(find . -maxdepth 1 -name "VelocityDrive*.apk" ! -name "VelocityDrive-latest.apk" | head -n 1)
          if [ -n "$VERSIONED_APK" ] && [ -f "$VERSIONED_APK" ]; then
            echo "Found versioned APK: $VERSIONED_APK"
            cp "$VERSIONED_APK" "VelocityDrive-latest.apk"
            echo "Created dual asset copy: VelocityDrive-latest.apk"
          else
            echo "Note: No root APK located in repository root (large binaries are usually excluded from git history)."
          fi

      - name: Publish or Update Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          TITLE="${{ github.event.inputs.release_name || github.ref_name }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Uploading dual assets..."
            if [ -f "VelocityDrive-latest.apk" ]; then
              gh release upload "$TAG" VelocityDrive*.apk "VelocityDrive-latest.apk" --clobber
            fi
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" \
              --title "$TITLE" \
              --generate-notes \
              ${{ github.event.inputs.prerelease == 'true' && '--prerelease' || '' }}
            if [ -f "VelocityDrive-latest.apk" ]; then
              gh release upload "$TAG" VelocityDrive*.apk "VelocityDrive-latest.apk" --clobber
            fi
          fi
